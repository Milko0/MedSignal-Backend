port 26379
# The primary is monitored by its fixed IP (docker-compose.local.yml): a hostname stops resolving while its container
# is down, and the failed lookups would keep Sentinel in TILT mode, which blocks the failover.
sentinel monitor mymaster 172.29.0.10 6379 2
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 10000
sentinel parallel-syncs mymaster 1
